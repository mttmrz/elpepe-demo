<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELPEPE — SDL2 Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: .15em;
      color: #14b8a6;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: .85rem;
      color: #7d8590;
      margin-bottom: 20px;
    }

    #canvas-wrap {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(20,184,166,.25);
      box-shadow: 0 0 40px rgba(20,184,166,.08);
    }

    canvas#canvas {
      display: block;
      width: 100%;
      max-width: 1280px;
      height: auto;
      background: #000;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity .4s;
    }

    #loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #1e2a38;
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status-text { font-size: .9rem; color: #7d8590; }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: transparent;
      border: 1px solid rgba(20,184,166,.4);
      color: #14b8a6;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .82rem;
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: rgba(20,184,166,.1); border-color: #14b8a6; }

    .keys {
      margin-top: 18px;
      font-size: .78rem;
      color: #484f58;
      text-align: center;
      line-height: 1.7;
    }
    .keys kbd {
      display: inline-block;
      background: #1e2a38;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: .74rem;
      color: #c9d1d9;
    }
  </style>
</head>
<body>
  <h1>ELPEPE</h1>
  <p class="subtitle">C++ · SDL2 · WebAssembly demo</p>

  <div id="canvas-wrap">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"
            width="1280" height="960"></canvas>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="status-text">Loading assets…</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="Module.requestFullscreen(true, false)">⛶ Fullscreen</button>
  </div>

  <p class="keys">
    <kbd>WASD</kbd> Move &nbsp;|&nbsp;
    <kbd>Q</kbd> Light / Heavy attack &nbsp;|&nbsp;
    <kbd>Space</kbd> Sword dash / Wand shot &nbsp;|&nbsp;
    <kbd>E</kbd> Interact &nbsp;|&nbsp;
    <kbd>Shift</kbd> Run
  </p>

  <script>
    var overlay    = document.getElementById('loading-overlay');
    var statusText = document.getElementById('status-text');

    var Module = {
      canvas: document.getElementById('canvas'),

      setStatus: function(text) {
        if (!text) {
          overlay.classList.add('hidden');
          return;
        }
        statusText.textContent = text;
      },

      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : '');
      },

      print: function() {},
      printErr: function(text) { console.error(text); },

      onRuntimeInitialized: function() {
        overlay.classList.add('hidden');
      }
    };

    window.onerror = function(msg) {
      statusText.textContent = 'Error: ' + msg;
    };
  </script>
  <script async src="index.js"></script>
</body>
</html>
