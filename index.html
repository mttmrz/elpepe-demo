<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELPEPE — SDL2 Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: .15em;
      color: #14b8a6;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: .85rem;
      color: #7d8590;
      margin-bottom: 20px;
    }

    #canvas-wrap {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(20,184,166,.25);
      box-shadow: 0 0 40px rgba(20,184,166,.08);
    }

    canvas#canvas {
      display: block;
      width: 100%;
      max-width: 1280px;
      height: auto;
      background: #000;
    }

    canvas#canvas:fullscreen,
    canvas#canvas:-webkit-full-screen,
    canvas#canvas:-moz-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      object-fit: contain;
    }

    /* ── overlays (loading + menu) ── */
    .overlay {
      position: absolute;
      inset: 0;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity .4s;
      z-index: 10;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }

    /* loading */
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #1e2a38;
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-text { font-size: .9rem; color: #7d8590; }

    /* menu */
    .menu-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 40%, rgba(20,184,166,.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .menu-title {
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      letter-spacing: .25em;
      color: #14b8a6;
      text-shadow: 0 0 48px rgba(20,184,166,.45);
      z-index: 1;
    }
    .menu-sub {
      font-size: .82rem;
      color: #484f58;
      letter-spacing: .08em;
      z-index: 1;
    }
    .menu-play {
      background: transparent;
      border: 2px solid #14b8a6;
      color: #14b8a6;
      padding: 13px 56px;
      border-radius: 8px;
      font-size: 1.1rem;
      letter-spacing: .25em;
      cursor: pointer;
      transition: background .2s, box-shadow .2s, transform .15s;
      z-index: 1;
    }
    .menu-play:hover {
      background: rgba(20,184,166,.14);
      box-shadow: 0 0 24px rgba(20,184,166,.3);
      transform: scale(1.04);
    }
    .menu-play:active { transform: scale(.98); }

    /* bottom bar */
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: transparent;
      border: 1px solid rgba(20,184,166,.4);
      color: #14b8a6;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .82rem;
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: rgba(20,184,166,.1); border-color: #14b8a6; }

    .keys {
      margin-top: 18px;
      font-size: .78rem;
      color: #484f58;
      text-align: center;
      line-height: 1.7;
    }
    .keys kbd {
      display: inline-block;
      background: #1e2a38;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: .74rem;
      color: #c9d1d9;
    }
  </style>
</head>
<body>
  <h1>ELPEPE</h1>
  <p class="subtitle">C++ · SDL2 · WebAssembly demo</p>

  <div id="canvas-wrap">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"
            width="1280" height="960"></canvas>

    <!-- loading overlay -->
    <div id="loading-overlay" class="overlay">
      <div class="spinner"></div>
      <div id="status-text">Loading assets…</div>
    </div>

    <!-- menu overlay (hidden until loading finishes) -->
    <div id="menu-overlay" class="overlay hidden">
      <div class="menu-glow"></div>
      <span class="menu-title">ELPEPE</span>
      <span class="menu-sub">C++ · SDL2 · WebAssembly</span>
      <button class="menu-play" onclick="playGame()">PLAY</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="toggleFS()">⛶ Fullscreen</button>
  </div>

  <p class="keys">
    <kbd>WASD</kbd> Move &nbsp;|&nbsp;
    <kbd>Q</kbd> Light / Heavy attack &nbsp;|&nbsp;
    <kbd>Space</kbd> Sword dash / Wand shot &nbsp;|&nbsp;
    <kbd>E</kbd> Interact &nbsp;|&nbsp;
    <kbd>Shift</kbd> Run
  </p>

  <script>
    var loadingOverlay = document.getElementById('loading-overlay');
    var menuOverlay    = document.getElementById('menu-overlay');
    var statusText     = document.getElementById('status-text');
    var gameStarted    = false;

    function playGame() {
      if (gameStarted) {
        location.reload();
      } else {
        gameStarted = true;
        menuOverlay.classList.add('hidden');
        document.getElementById('canvas').focus();
        Module.ccall('start_game', null, [], []);
      }
    }

    // called from C++ via EM_ASM({ showMenu(); })
    function showMenu() {
      menuOverlay.classList.remove('hidden');
    }

    function toggleFS() {
      var canvas = document.getElementById('canvas');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        var req = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
        if (req) req.call(canvas);
      } else {
        var ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      }
    }

    var Module = {
      canvas: document.getElementById('canvas'),

      setStatus: function(text) {
        if (!text) {
          loadingOverlay.classList.add('hidden');
          menuOverlay.classList.remove('hidden');
          return;
        }
        statusText.textContent = text;
      },

      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : '');
      },

      print: function() {},
      printErr: function(text) { console.error(text); },
    };

    window.onerror = function(msg) {
      statusText.textContent = 'Error: ' + msg;
    };
  </script>
  <script async src="index.js"></script>
</body>
</html>
